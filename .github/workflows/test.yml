name: Test favicon plugin

on:
  push:
    branches: [latest, next, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.12.0', '22', '24', '26']
        vite: ['7.3.8', '8.3.8']
        include:
          - { os: ubuntu-latest, node: '22.12.0', vite: '7.3.0' }
          - { os: ubuntu-latest, node: '22.12.0', vite: '8.3.0' }
          - { os: macos-latest, node: '24', vite: '7.3.8' }
          - { os: macos-latest, node: '24', vite: '8.3.8' }
          - { os: windows-latest, node: '24', vite: '7.3.8' }
          - { os: windows-latest, node: '24', vite: '8.3.8' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npx --yes npm@11.21.3 ci
      - run: npx --yes npm@11.21.3 install --no-save --package-lock=false vite-under-test@npm:vite@${{ matrix.vite }}
      - run: npx --yes npm@11.21.3 test
        env:
          VITE_UNDER_TEST: vite-under-test
      - run: npx --yes npm@11.21.3 run test:package
        env:
          VITE_PACKAGE_VERSION: ${{ matrix.vite }}

  package-managers:
    strategy:
      fail-fast: false
      matrix:
        package-manager: [pnpm, yarn]
        vite: ['7.3.8', '8.3.8']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npx --yes npm@11.21.3 ci
      - run: npx --yes npm@11.21.3 run test:package
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
          VITE_PACKAGE_VERSION: ${{ matrix.vite }}
